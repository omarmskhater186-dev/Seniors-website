  <text x="4" y="60" font-family="Montserrat, Arial, sans-serif"
        font-size="62" font-weight="800" fill="#144053">60</text>

  <!-- "+" rendered as a medical cross in Baby Blue -->
  <g transform="translate(120 14)">
    <rect x="18" y="0"  width="16" height="52" rx="4" fill="#6dcad6"/>
    <rect x="0"  y="18" width="52" height="16" rx="4" fill="#6dcad6"/>
  </g>
</svg>
